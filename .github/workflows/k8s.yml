name: k8s

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/k8s.yml"
  workflow_dispatch:

jobs:
  kind-deploy:
    name: Build, deploy to kind, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          config: deploy/kind-config.yaml
          cluster_name: smt

      - name: Ensure namespace
        run: kubectl create namespace smt --dry-run=client -o yaml | kubectl apply -f -

      - name: Build images
        run: |
          docker build -f deploy/docker/backend.Dockerfile -t smt-api:ci ./backend
          docker build -f deploy/docker/frontend.Dockerfile \
            --build-arg VITE_API_URL=same-origin -t smt-web:ci ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image smt-api:ci smt-web:ci --name smt

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm install ing ingress-nginx/ingress-nginx \
            --namespace smt \
            --version 4.11.3 \
            --set controller.hostPort.enabled=true \
            --set controller.service.type=ClusterIP \
            --set controller.admissionWebhooks.enabled=false \
            --set controller.nodeSelector."ingress-ready"="true"
          kubectl -n smt rollout status deploy/ing-ingress-nginx-controller --timeout=480s

      - name: Install kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install obs prometheus-community/kube-prometheus-stack \
            --namespace smt \
            --version 65.5.1 \
            --set alertmanager.enabled=false \
            --set defaultRules.create=false \
            --set grafana.adminPassword=admin123 \
            --set grafana.persistence.enabled=false \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --wait --timeout 10m

      - name: Deploy app chart
        run: |
          SECRET=$(openssl rand -hex 32)
          helm install smt deploy/helm/smt \
            --namespace smt \
            --set-string api.image=smt-api:ci \
            --set-string web.image=smt-web:ci \
            --set-string secretKey="$SECRET" \
            --wait --timeout 6m

      - name: Smoke tests
        run: bash deploy/scripts/k8s-smoke.sh

      - name: Debug dump
        if: failure()
        run: |
          {
            echo "## Cluster state"
            kubectl get pods,svc,ingress -A -o wide || true
            echo "## ingress-nginx pods describe"
            kubectl -n smt describe deploy -l app.kubernetes.io/name=ingress-nginx || true
            kubectl -n smt get events --sort-by=.lastTimestamp | tail -60 || true
            echo "## helm releases"
            helm list -A || true
          } > k8s-debug.log 2>&1 || true
          tail -100 k8s-debug.log

      - name: Commit debug log
        if: failure()
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci-bot"
          git add k8s-debug.log
          git commit -m "ci: k8s debug log [skip ci]" || true
          git push

  terraform-plan:
    name: Terraform validate + plan (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,ecr,iam,sts
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -backend=false
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Terraform validate
        run: terraform validate

      # plan the LocalStack-supported modules; the EKS module is gated off
      # (community LocalStack cannot emulate EKS) and is validated above only
      - name: Terraform plan (localstack)
        run: |
          terraform plan \
            -var="use_localstack=true" \
            -var="enable_eks=false" \
            -target=module.network \
            -target=module.storage \
            -target=module.registry \
            -input=false
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
