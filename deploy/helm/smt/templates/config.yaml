apiVersion: v1
kind: Secret
metadata:
  name: smt-secrets
  labels:
    app: smt
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@smt-postgres:5432/{{ .Values.postgres.database }}"
  SECRET_KEY: {{ .Values.secretKey | quote }}
  CRON_SECRET: {{ sha256sum (printf "%s-%s" .Release.Name .Values.secretKey) | trunc 32 | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smt-config
  labels:
    app: smt
data:
  JOB_EXECUTION_MODE: {{ .Values.api.env.JOB_EXECUTION_MODE | quote }}
  STORAGE_BACKEND: {{ .Values.api.env.STORAGE_BACKEND | quote }}
  CORS_ORIGINS: {{ .Values.api.env.CORS_ORIGINS | quote }}
  FRONTEND_URL: {{ .Values.api.env.FRONTEND_URL | quote }}
  PUBLIC_API_URL: {{ .Values.api.env.PUBLIC_API_URL | quote }}
